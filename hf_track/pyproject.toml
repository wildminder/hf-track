[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hf-track"
version = "0.1.0"
description = "Plug-and-play progress tracking for HuggingFace Hub uploads and downloads"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "hf-track contributors" }]
keywords = ["huggingface", "track", "upload", "download", "tracking", "xet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "huggingface_hub>=0.23.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
xet = ["hf_xet>=0.1.0"]
sse = ["fastapi>=0.100.0", "sse-starlette>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.urls]
Documentation = "https://github.com/example/hf-track#readme"
Repository = "https://github.com/example/hf-track"

[tool.hatch.build.targets.wheel]
packages = ["src/hf_track"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring real HF credentials (deselect with '-m \"not integration\"')",
]
