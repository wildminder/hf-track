name: ci

# NTH-013 / IMP-022: the lint gate, plus the test job the suite finally
# earns. The test job was held back while the suite aborted during
# collection; it is added now that `pytest` collects and passes cleanly.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (F821, F811 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.15"

      # The gate: same rule set as [tool.ruff.lint] in hf_track/pyproject.toml,
      # same scope as the `ruff-lint-gate` pre-commit hook. No --fix here on
      # purpose — CI reports, it does not rewrite a pull request.
      #
      # Scope is the shipped package only. Tests and examples are covered by
      # the advisory step below: the gate's job is to stop a bug shipping, and
      # the F821/F811 debt in tests belongs to whoever owns each file.
      - name: Gate (blocking)
        run: python -m ruff check hf_track/src --output-format=github

      # Report-only. Informational until the count reaches zero; a non-zero
      # exit is tolerated deliberately.
      - name: Hygiene (advisory)
        run: python -m ruff check . --select F401,E402,F841,E731 --exit-zero
        continue-on-error: true

      # IMP-023: the documentation link check runs here, in the same job as
      # the lint gate, because both are "the tree disagrees with itself"
      # checks. A dead link in docs/README.md and an undefined name in the
      # package are the same class of defect — a claim that stopped being
      # true — and splitting them across jobs would let both go unnoticed
      # whenever one of them is skipped.
      #
      # --check is a pure comparison: exit 1 when docs/README.md no longer
      # matches what the generator would emit, exit 2 when a relative link
      # resolves to nothing. It writes nothing.
      - name: Docs index is current (blocking)
        run: python hf_track/tools/generate_docs_index.py --check

  test:
    name: test (unit)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional: process spawn there is slower than the
        # timings several subprocess tests used, which is what made them
        # order-dependent. A Linux-only matrix would not have caught it.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "hf_track[dev,xet]"

      # -m "not integration": those tests hit huggingface.co. They are
      # genuinely useful but must not gate a commit -- a TLS blip or a Hub
      # outage would otherwise red the whole project.
      - name: Unit tests
        run: python -m pytest hf_track/tests -m "not integration" -q --cov=hf_track --cov-report=term-missing

      - name: Wheel builds and installs clean
        run: |
          python -m pip install --upgrade build twine
          python -m build hf_track --outdir dist
          python -m twine check dist/*

  integration:
    name: integration (network)
    runs-on: ubuntu-latest
    # Never blocks a merge: these download from huggingface.co.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e "hf_track[dev,xet]"

      - name: Integration tests
        run: python -m pytest hf_track/tests -m integration -q --no-cov